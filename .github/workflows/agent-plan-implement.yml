name: Agent Plan and Implement

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open agent-task issue to plan and implement
        required: true
        type: string

concurrency:
  group: agent-plan-implement-${{ inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  COPILOT_CLI_VERSION: 1.0.83
  ISSUE_NUMBER: ${{ inputs.issue_number }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      copilot-requests: write
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Require a default-branch dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

      - name: Check out the immutable run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record the immutable base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate the issue number
        run: |
          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::issue_number must be a positive integer."
            exit 1
          fi

      - name: Read and validate the task contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          gh issue view "$ISSUE_NUMBER" \
            --json number,title,state,labels,body,url \
            > "$RUNNER_TEMP/handoff/issue.json"
          python3 .github/scripts/agent_delivery.py validate-issue \
            --issue-json "$RUNNER_TEMP/handoff/issue.json" \
            --issue-number "$ISSUE_NUMBER"

      - name: Build the planning brief
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          python3 .github/scripts/agent_delivery.py build-prompt \
            --phase plan \
            --issue-json "$RUNNER_TEMP/handoff/issue.json" \
            --base-sha "$BASE_SHA" \
            --output "$RUNNER_TEMP/handoff/planning-prompt.md"

      - name: Install the pinned Copilot CLI
        run: |
          npm install --global "@github/copilot@$COPILOT_CLI_VERSION"
          copilot --version

      - name: Produce the plan with backend-engineer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            --agent backend-engineer \
            --no-ask-user \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write,shell,url,memory' \
            --max-ai-credits 100 \
            -s \
            -p "$(cat "$RUNNER_TEMP/handoff/planning-prompt.md")" \
            > "$RUNNER_TEMP/handoff/plan.md"

      - name: Validate the plan and clean planning boundary
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          python3 .github/scripts/agent_delivery.py validate-plan \
            --plan "$RUNNER_TEMP/handoff/plan.md" \
            --issue-number "$ISSUE_NUMBER" \
            --base-sha "$BASE_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish the plan in the run summary
        run: |
          {
            echo "## Validated planning artifact"
            echo
            cat "$RUNNER_TEMP/handoff/plan.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the planning handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/handoff/issue.json
            ${{ runner.temp }}/handoff/plan.md
          if-no-files-found: error
          retention-days: 7

  implement:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      copilot-requests: write

    steps:
      - name: Check out the planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false

      - name: Download the planning handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff

      - name: Revalidate the planning handoff
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 .github/scripts/agent_delivery.py validate-issue \
            --issue-json "$RUNNER_TEMP/handoff/issue.json" \
            --issue-number "$ISSUE_NUMBER"
          python3 .github/scripts/agent_delivery.py validate-plan \
            --plan "$RUNNER_TEMP/handoff/plan.md" \
            --issue-number "$ISSUE_NUMBER" \
            --base-sha "$BASE_SHA"

      - name: Build the implementation brief
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          python3 .github/scripts/agent_delivery.py build-prompt \
            --phase implement \
            --issue-json "$RUNNER_TEMP/handoff/issue.json" \
            --base-sha "$BASE_SHA" \
            --plan "$RUNNER_TEMP/handoff/plan.md" \
            --output "$RUNNER_TEMP/handoff/implementation-prompt.md"

      - name: Install the pinned Copilot CLI
        run: |
          npm install --global "@github/copilot@$COPILOT_CLI_VERSION"
          copilot --version

      - name: Implement the validated plan with backend-engineer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            --agent backend-engineer \
            --no-ask-user \
            --available-tools='view,grep,glob,edit,bash' \
            --allow-tool='read,write,shell(dotnet:*)' \
            --deny-tool='shell(git push),shell(gh:*)' \
            --max-ai-credits 500 \
            -s \
            -p "$(cat "$RUNNER_TEMP/handoff/implementation-prompt.md")"

      - name: Enforce the implementation boundary
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          python3 .github/scripts/agent_delivery.py validate-changes \
            --base-sha "$BASE_SHA"
          git diff --check

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore, build, and test independently
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/delivery/test-results"
          dotnet tool restore 2>&1 | tee "$RUNNER_TEMP/delivery/tool-restore.log"
          dotnet restore 2>&1 | tee "$RUNNER_TEMP/delivery/restore.log"
          dotnet build --no-restore 2>&1 | tee "$RUNNER_TEMP/delivery/build.log"
          dotnet test --no-build \
            --logger trx \
            --results-directory "$RUNNER_TEMP/delivery/test-results" \
            2>&1 | tee "$RUNNER_TEMP/delivery/test.log"

      - name: Package the implementation and evidence
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          git add --intent-to-add -- \
            backend/src/CustomerManagement.Api \
            backend/tests/CustomerManagement.UnitTests \
            backend/tests/CustomerManagement.AcceptanceTests
          git diff --binary --full-index > "$RUNNER_TEMP/delivery/implementation.patch"
          test -s "$RUNNER_TEMP/delivery/implementation.patch"

          {
            echo "- Planned from issue #$ISSUE_NUMBER at base commit \`$BASE_SHA\`."
            echo "- \`dotnet tool restore\`: passed."
            echo "- \`dotnet restore\`: passed."
            echo "- \`dotnet build --no-restore\`: passed."
            echo "- \`dotnet test --no-build\`: passed."
            echo
            echo "Test summary:"
            echo '```text'
            grep -E 'Passed!|Failed!|Total tests:' "$RUNNER_TEMP/delivery/test.log" || true
            echo '```'
            echo
            echo "Full logs and TRX results are retained with workflow run $GITHUB_RUN_ID."
          } > "$RUNNER_TEMP/delivery/evidence.md"

      - name: Upload the verified implementation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: implementation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/delivery/implementation.patch
            ${{ runner.temp }}/delivery/evidence.md
            ${{ runner.temp }}/delivery/*.log
            ${{ runner.temp }}/delivery/test-results/*.trx
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    needs:
      - plan
      - implement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out the planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}

      - name: Download the planning handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff

      - name: Download the verified implementation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: implementation-${{ github.run_id }}
          path: ${{ runner.temp }}/delivery

      - name: Refuse a duplicate pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(
            gh pr list --state open --json number,body \
              --jq ".[] | select((.body // \"\") | contains(\"Closes #$ISSUE_NUMBER\")) | .number" \
              | head -n 1
          )"
          if [[ -n "$existing" ]]; then
            echo "::error::Open pull request #$existing already closes issue #$ISSUE_NUMBER."
            exit 1
          fi

      - name: Apply and revalidate the implementation
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          git apply --check "$RUNNER_TEMP/delivery/implementation.patch"
          git apply "$RUNNER_TEMP/delivery/implementation.patch"
          python3 .github/scripts/agent_delivery.py validate-changes \
            --base-sha "$BASE_SHA"
          git diff --check

      - name: Render the pull request contract
        run: |
          python3 .github/scripts/agent_delivery.py render-pr \
            --issue-json "$RUNNER_TEMP/handoff/issue.json" \
            --plan "$RUNNER_TEMP/handoff/plan.md" \
            --evidence "$RUNNER_TEMP/delivery/evidence.md" \
            --output "$RUNNER_TEMP/delivery/pr-body.md" \
            --title-output "$RUNNER_TEMP/delivery/pr-title.txt"

      - name: Commit, push, and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="copilot/issue-$ISSUE_NUMBER-plan-implement-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit \
            -m "Implement agent task #$ISSUE_NUMBER" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push --set-upstream origin "$branch"

          pr_url="$(
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$(cat "$RUNNER_TEMP/delivery/pr-title.txt")" \
              --body-file "$RUNNER_TEMP/delivery/pr-body.md"
          )"
          {
            echo "## Pull request created"
            echo
            echo "$pr_url"
            echo
            echo "Approve its workflow runs, then review the required checks and diff."
          } >> "$GITHUB_STEP_SUMMARY"
